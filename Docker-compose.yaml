version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8020"
    volumes:
      - .:/app
    ports:
      - "8020:8020"
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=taskmanager.settings
      - ENGINE=django.db.backends.sqlite3
      - SQLITE_DB_NAME=db.sqlite3

volumes:
  postgres_data:
